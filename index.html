<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Pizza Promo Slider</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="css/promo-slider.css">
</head>
<body>

<section class="promo">
    <div class="swiper promo-swiper">
        <div class="swiper-wrapper">

            <div class="swiper-slide promo-slide">
                <img src="https://images.unsplash.com/photo-1601924928580-fd3d3b1dba5c" alt="Pepperoni">
                <div class="promo-content">
                    <h2>Піца Пепероні</h2>
                    <p>Гостра, соковита, ідеальна</p>
                    <button>Замовити</button>
                </div>
            </div>

            <div class="swiper-slide promo-slide">
                <img src="https://images.unsplash.com/photo-1548365328-8b849e6c7f1f" alt="Cheese">
                <div class="promo-content">
                    <h2>Сирна піца</h2>
                    <p>4 сири — максимум смаку</p>
                    <button>Замовити</button>
                </div>
            </div>

            <div class="swiper-slide promo-slide">
                <img src="https://images.unsplash.com/photo-1593560708920-61dd98c46a4e" alt="BBQ">
                <div class="promo-content">
                    <h2>BBQ піца</h2>
                    <p>М’ясо, соус BBQ, димний смак</p>
                    <button>Замовити</button>
                </div>
            </div>

        </div>

        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script type="module" src="js/promoSlider.js"></script>
</body>
</html>
